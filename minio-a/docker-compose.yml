services:
  minio:
    image: "quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z"
    container_name: minio-a
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
